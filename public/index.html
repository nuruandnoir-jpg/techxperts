<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TechXperts — Your tech team, on your timeline</title>
  <meta name="description" content="Get a team of developers to build your product, on your deadline. Web, AI, cloud and site care." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&family=Cormorant+Garamond:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <script>
    // Apply the saved theme (or the device setting) before the page paints, so it never flashes.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('tx_theme'); } catch (e) {}
      var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%237b2cbf'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='monospace' font-weight='700'>&lt;/&gt;</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <button class="split-btn menu-btn" aria-expanded="false" aria-controls="nav"><span class="ico" aria-hidden="true">☰</span><span class="lbl">Menu</span></button>
      <a href="#/" class="brand" aria-label="TechXperts home">tech<span>x</span>perts</a>
      <div class="top-actions" id="top-actions"></div>
    </div>
    <nav id="nav" class="menu-panel" aria-label="Main"></nav>
  </header>
  <main id="app" class="container" tabindex="-1"></main>
  <footer class="footer">
    <div class="container footer-inner">
      <span><span class="brand-mark small">&lt;/&gt;</span> TechXperts — your tech team, on your timeline.</span>
      <span class="muted">© <span id="year"></span> TechXperts</span>
    </div>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
